[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ghimera"
version = "0.4.6"
description = "Intent-driven web research with bounded collection and source-bound evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josh Gompert" }]
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5", "curl_cffi==0.16.3", "protego==0.7.0"]

[project.urls]
Homepage = "https://github.com/ginkorea/ghimera"
Repository = "https://github.com/ginkorea/ghimera"
Issues = "https://github.com/ginkorea/ghimera/issues"
Changelog = "https://github.com/ginkorea/ghimera/blob/main/CHANGELOG.md"

[project.scripts]
ghimera = "ghimera.command:main"
ghimera-delivery = "ghimera.delivery_command:main"

[project.optional-dependencies]
browser = ["patchright==1.63.0"]
html = ["scrapling==0.4.2", "crawl4ai==0.9.4", "lingua-language-detector==2.1.1"]
documents = ["docling-slim[convert-core,format-docx,format-pdf]==2.134.0", "docling-core==2.99.0", "lingua-language-detector==2.1.1"]
pdf-ocr = ["tesserocr==2.11.0"]
pdf-transcription = ["pypdfium2==5.14.0", "Pillow==12.3.0"]
images = ["Pillow==12.3.0"]
corpus = ["faiss-cpu==1.15.1", "numpy==2.4.6; python_version < '3.12'", "numpy==2.5.3; python_version >= '3.12'"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0", "jsonschema==4.26.0"]

[tool.hatch.build]
# Git worktrees use a .git pointer FILE; default directory exclusions miss it.
exclude = [".git", ".git/**", ".venv/**", "gate-work/**", "**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/ghimera", "src/chimera"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ghimera", "src/chimera"]
mypy_path = ["typing"]
