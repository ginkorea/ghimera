[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "taipan-chimera"
version = "0.1.0"
description = "Goal-directed collection through injected fetch and served-model ports"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/chimera"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/chimera"]
