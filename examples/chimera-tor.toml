# Example only: provision Tor separately on the approved crawl-egress host.
schema = "chimera.config/1"
page_budget = 20
byte_budget = 16777216
wall_seconds = 600.0
judge_budget = 20
grade_interval = 5
grade_threshold = 0.9
saturation_window = 5
saturation_min_new = 1
min_link_score = 0.2
max_links_per_page = 20
request_timeout_seconds = 45.0
per_host_delay_seconds = 2.0
per_host_concurrency = 2
global_concurrency = 4
global_requests_per_second = 1.0
retry_budget = 1
impersonation_profile = "chrome145"
user_agent = "Chimera/0.1 (contact: operator@example.invalid)"
egress_feature = "crawl_egress"
model_policy = "self_hosted_only"

[http]
schema = "chimera.http/1"
max_response_bytes = 1048576
max_header_bytes = 65536
max_redirects = 3
retry_backoff_seconds = 1.0
retry_jitter_seconds = 0.5
robots_cache_seconds = 3600.0
conditional_cache_entries = 100

[http.network]
schema = "chimera.network/1"
mode = "public"
allowed_ports = [80, 443]

[http.robots]
schema = "chimera.robots/1"
mode = "honor"
product_token = "Chimera"

[transport]
schema = "chimera.transport/1"
default_route = "tor"
rules = []
allow_cross_network_redirects = false
allow_route_change_redirects = false

[transport.tor]
schema = "chimera.tor/1"
proxy_endpoint = "socks5h://127.0.0.1:9050"
bridge_directory = "/tmp"
connect_timeout_seconds = 35.0
allow_open_web = true
allow_onion = true
allowed_ports = [80, 443]
isolation = "request"
