# Inert fragment; requires a complete native recipe with matching enabled graph,
# bound analyst, existing run budgets and (for ACK replay) journal/model results.
# These generic definitions are operator inputs, not a built-in domain ontology.
# The graph must supply entity roles and a semantic reports_to relation with
# entity source/target roles, plus its native document-to-entity mentions rule.
[semantics]
schema = "ghimera.semantics/5"
prompt_profile = "graph_bound_native_spans"
model_role = "analyst"
window_chars = 1000
max_windows_per_document = 3
max_calls_per_run = 8
max_mentions_per_window = 8
max_relations_per_window = 8
entity_roles = ["entity"]
relation_rules = ["reports_to"]
mention_rule = "mentions"

[[semantics.role_definitions]]
name = "entity"
definition = "A named institutional entity in the source, not a generic population or topic."

[[semantics.relation_definitions]]
name = "reports_to"
definition = "The source explicitly states that the source institution reports to the target institution."

# OMIT verification and failure: /5 outputs are UNREVIEWED source-local model
# assertions. Select /4 with a separately bound reviewer for independent review.
# No model endpoint, credential, acquisition, network call or work starts here.
