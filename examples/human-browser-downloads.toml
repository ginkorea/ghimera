# Non-active fragment for an application-bound, explicitly selected Page.
# Merge into a complete Collector configuration; it supplies no browser,
# credentials, model, source entitlement or storage quota. The application
# enables downloads on its own browser and injects BoundPageHumanSession.
[human_browser]
schema = "ghimera.human-browser/1"
adapter = "patchright_page"
adapter_revision = "ghimera-human-chromium/1"
driver_version = "1.63.0"
session_id = "dedicated-research-session"
target_id = "REPLACE-EXPLICIT-TARGET-ID"
lifecycle = "caller_managed"
network_boundary = "operator_managed_browser"
declared_route = "direct"
assistance_reasons = ["challenge_not_solved", "login_wall", "paywall"]
max_assistance_attempts = 2
timeout_seconds = 180.0
assistance_timeout_seconds = 90.0
cleanup_timeout_seconds = 5.0
max_dom_bytes = 2097152

[[human_browser.origins]]
origin = "https://publisher.example"
path_prefixes = ["/research", "/login"]
allow_http = false

[human_browser.downloads]
schema = "ghimera.browser-downloads/1"
adapter_revision = "ghimera-patchright-download-stream/1"
max_file_bytes = 16777216
read_chunk_bytes = 65536

[[human_browser.downloads.actions]]
source_url = "https://publisher.example/research/report.pdf"
navigation_url = "https://publisher.example/research/report"
selector = "a#download-original"
content_type = "application/pdf"
