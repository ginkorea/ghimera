# Inert example: place in the main recipe's scoring block; replace both complete
# service declarations with your authorized deployment and exact vector identity.
schema = "ghimera.scoring/2"
reference_source = "intent"
encoding_call_budget = 100
encoding_char_budget = 100000
window_chars = 300
overlap_chars = 30
max_windows = 32
max_links = 20
max_reference_chunks = 1
max_anchor_chars = 100
keyword_weight = 0.2

[encoder]
schema = "chimera.embedding-service/1"
endpoint = "https://encoder.invalid/v1/embeddings"
approved_addresses = ["10.0.0.10"]
allow_plaintext = false
allow_plaintext_credentials = false
authorization = "none"
model_id = "replace-with-your-encoder-id"
revision = "replace-with-your-exact-vector-revision"
served_model = "replace-with-your-served-model-name"
timeout_seconds = 30.0
max_request_bytes = 65536
max_response_bytes = 262144
max_header_bytes = 8192
require_usage = true
max_input_chars = 8000
dimensions = 384
request_dimensions = false
max_batch_texts = 8
max_text_chars = 400
text_prefix = "passage: "

[query_encoder]
schema = "chimera.embedding-service/1"
endpoint = "https://encoder.invalid/v1/embeddings"
approved_addresses = ["10.0.0.10"]
allow_plaintext = false
allow_plaintext_credentials = false
authorization = "none"
model_id = "replace-with-your-encoder-id"
revision = "replace-with-your-exact-vector-revision"
served_model = "replace-with-your-served-model-name"
timeout_seconds = 30.0
max_request_bytes = 65536
max_response_bytes = 262144
max_header_bytes = 8192
require_usage = true
max_input_chars = 8000
dimensions = 384
request_dimensions = false
max_batch_texts = 8
max_text_chars = 400
text_prefix = "query: "
