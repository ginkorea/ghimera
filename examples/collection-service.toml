# Non-active example. Replace private paths and bind native model/source recipes.
# Existing corpus/outbox/destination stores must be explicitly created through
# their native APIs before startup. Never place bearer values in this file.
schema = "ghimera.service-command/1"
host = "127.0.0.1"
port = 8765
credential_environment_variable = "GHIMERA_SERVICE_BEARER"
max_request_bytes = 1000000
max_header_bytes = 16384
request_timeout_seconds = 30.0
max_connections = 16

[service]
schema = "ghimera.collection-service/1"
directory = "/replace/private/service"
max_jobs = 100
max_active_jobs = 1
max_manifest_bytes = 65536
rounds_per_checkpoint = 1
handoff_retry_seconds = 5.0
max_handoff_attempts = 8
shutdown_grace_seconds = 30.0

[service.command]
schema = "ghimera.collector-command/2"
config_path = "/replace/private/collector.toml"
request_path = "/replace/private/unused-request-template.json"
output_directory = "/replace/private/unused-output-template"
run_id = "service-template"
max_input_bytes = 1000000
max_result_bytes = 50000000
# bindings_path = "/replace/private/credential-bindings.json"
# references_path = "/replace/private/references.json"

[service.command.execution]
schema = "ghimera.command-execution/1"
operation = "run"

# Optional [service.corpus] uses the complete examples/corpus.toml contract.
# Optional [service.outbox] uses examples/delivery-outbox.toml, including target.
# Optional [delivery_destination] uses examples/directory-delivery.toml.
