# Non-active standalone corpus recipe. Create the chosen parent first.
# Bind a reviewed local encoder before use; this example launches nothing.
schema = "ghimera.corpus/1"
directory = "/srv/ghimera/evidence/example"
chunk_chars = 1200
overlap_chars = 160
max_documents = 10000
max_chunks = 100000
max_document_bytes = 16777216
max_stored_document_bytes = 1073741824
max_vector_bytes = 2147483648
max_audit_entries = 100000
max_audit_bytes = 268435456
max_encoding_calls_per_append = 1000
max_encoding_chars_per_append = 2000000
max_query_chars = 1200
max_top_k = 20
search_candidates = 100
minimum_cosine = 0.25
hnsw_neighbors = 32
hnsw_construction = 200
hnsw_search = 128
database_timeout_seconds = 5.0
operation_timeout_seconds = 600.0

[encoder]
schema = "chimera.embedding-service/1"
endpoint = "http://127.0.0.1:18095/v1/embeddings"
approved_addresses = ["127.0.0.1"]
allow_plaintext = true
allow_plaintext_credentials = false
authorization = "none"
model_id = "configure-reviewed-multilingual-encoder"
revision = "replace-with-immutable-revision"
served_model = "local-encoder"
timeout_seconds = 30.0
max_request_bytes = 1048576
max_response_bytes = 2097152
max_header_bytes = 16384
require_usage = true
max_input_chars = 20000
dimensions = 1024
request_dimensions = false
max_batch_texts = 16
max_text_chars = 1400
text_prefix = ""

[query_encoder]
schema = "chimera.embedding-service/1"
endpoint = "http://127.0.0.1:18095/v1/embeddings"
approved_addresses = ["127.0.0.1"]
allow_plaintext = true
allow_plaintext_credentials = false
authorization = "none"
model_id = "configure-reviewed-multilingual-encoder"
revision = "replace-with-immutable-revision"
served_model = "local-encoder"
timeout_seconds = 30.0
max_request_bytes = 1048576
max_response_bytes = 2097152
max_header_bytes = 16384
require_usage = true
max_input_chars = 20000
dimensions = 1024
request_dimensions = false
max_batch_texts = 16
max_text_chars = 1400
text_prefix = ""
