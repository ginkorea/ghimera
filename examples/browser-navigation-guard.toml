# Merge into a complete human_browser recipe using adapter="patchright_page".
# Inject the application-owned Page session into Collector; this is not a CLI
# browser launcher, profile importer or proof of browser-wide routing.
[human_browser.navigation]
schema = "ghimera.browser-navigation/1"
adapter_revision = "ghimera-chromium-navigation-guard/1"
interception_owner = "exclusive_main_frame_during_operation"
max_redirects = 4
admission_timeout_seconds = 10.0
cleanup_timeout_seconds = 3.0
