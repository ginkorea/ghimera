# Example only: choose your owned output location and source handling explicitly.
# Load this as the main configuration's [graph] section, or via GraphConfig.from_toml.
schema = "chimera.graph-config/1"
enabled = true
profile = "research"
profile_version = "2"
identity_namespace = "my-research"
projection_mode = "research"
sink_path = "/tmp/chimera-research-graphs"
max_batch_bytes = 2097152
max_nodes = 10000
max_edges = 20000
capture_semantics = true
semantic_min_confidence = 0.9
source_audiences = ["owner"]
handling_labels = ["research-run"]

[[roles]]
name = "intent"
kind = "research_intent"

[[roles]]
name = "question"
kind = "research_question"

[[roles]]
name = "query"
kind = "search_query"

[[roles]]
name = "source"
kind = "source"

[[roles]]
name = "document"
kind = "content"

[[roles]]
name = "entity"
kind = "entity"

[[relations]]
name = "discovered"
predicate = "discovered_from"
source_roles = ["source"]
target_roles = ["intent", "document", "query"]
semantic = false

[[relations]]
name = "question_for"
predicate = "question_for"
source_roles = ["question"]
target_roles = ["intent"]
semantic = false

[[relations]]
name = "query_for"
predicate = "query_for"
source_roles = ["query"]
target_roles = ["question"]
semantic = false

[[relations]]
name = "retrieved"
predicate = "retrieved_from"
source_roles = ["document"]
target_roles = ["source"]
semantic = false

[[relations]]
name = "mentions"
predicate = "mentions"
source_roles = ["document"]
target_roles = ["entity"]
semantic = true
