# Byparr 3.0.4 switched browser stacks; do not describe it as Camoufox.
# Its request wire uses maxTimeout (milliseconds) and returnOnlyCookies.
[challenges]
schema = "ghimera.challenges/2"
provider = "byparr"
provider_version = "3.0.4"
wire_dialect = "flaresolverr"
endpoint = "http://127.0.0.1:8191/v1"
network_boundary = "operator_managed_local_browser_gateway"
allowed_origins = ["https://publisher.example"]
allowed_cookie_names = ["cf_clearance"]
max_attempts_per_run = 2
timeout_seconds = 60.0
max_request_bytes = 8192
max_response_bytes = 65536
max_header_bytes = 16384
max_cookie_bytes = 4096
session_ttl_seconds = 300.0
session_cache_entries = 8
