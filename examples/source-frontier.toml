# Append to an explicitly configured source-work/journal collector recipe.
# These are operator capacities, not defaults or a filesystem quota.
# Entry/payload limits cover both web intents and configured local-document batches.
[source_work.frontier]
schema = "ghimera.source-frontier/1"
max_entries = 10000
max_entry_bytes = 16384
max_frontier_bytes = 16777216
