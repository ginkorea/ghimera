[pdf_models]
schema = "ghimera.pdf-models/2"
layout_repository = "docling-project/docling-layout-heron-onnx"
layout_revision = "40bde044036bb181c130ddf6c51792187268748f"
layout_engine = "onnxruntime"
layout_model_filename = "model.onnx"
layout_score_threshold = 0.3
table_mode = "accurate"
table_cell_matching = true
images_scale = 2.0

[[pdf_models.runtime_packages]]
name = "docling-ibm-models"
version = "4.0.3"
[[pdf_models.runtime_packages]]
name = "torch"
version = "2.9.1+cpu"
[[pdf_models.runtime_packages]]
name = "torchvision"
version = "0.24.1+cpu"
[[pdf_models.runtime_packages]]
name = "transformers"
version = "4.57.6"
[[pdf_models.runtime_packages]]
name = "onnxruntime"
version = "1.23.2"
[[pdf_models.runtime_packages]]
name = "tesserocr"
version = "2.11.0"

[pdf_models.ocr]
engine = "tesserocr"
languages = ["chi_sim", "chi_tra", "jpn", "jpn_vert", "kor", "fil", "eng", "ind", "msa", "vie", "tha"]
data_directory = "tessdata"
native_version = "tesseract 5.5.1"
page_segmentation = 6
orientation = "preserve"
minimum_orientation_confidence = 15.0
mode = "full_page"
scale = 3.0

[pdf_models.reading_order]
schema = "chimera.reading-order/1"
method = "xy_cut"
column_direction = "left_to_right"
min_column_gap_ratio = 0.015
min_row_gap_ratio = 0.015
max_recursion_depth = 32
