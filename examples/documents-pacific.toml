# Offline scanned-PDF OCR with explicit native language packs.
# Supply your own private worker, scratch and artifact root. Nothing downloads
# during collection. Install documents + pdf-ocr and the pinned PDF packages.
# Prefer a source-specific subset in pdf_models.ocr.languages for each run;
# changing languages produces a new configuration digest. All admitted files
# below must remain in the artifact manifest, including auxiliary osd data.
# Chinese/Japanese packs: tessdata_best e12c65a915945e4c28e237a9b52bc4a8f39a0cec.
# Other packs: tessdata_fast 87416418657359cb625c412a48b6e1d6d41c29bd.
schema = "chimera.document-extraction/1"
worker_python = "/path/to/private/ghimera-documents/bin/python"
work_directory = "/path/to/private/ghimera/documents"
artifacts_directory = "/path/to/private/ghimera/pdf-models"
max_input_bytes = 16777216
max_output_bytes = 8388608
max_diagnostic_bytes = 65536
max_text_chars = 500000
max_links = 200
max_workers = 2
timeout_seconds = 240.0
cleanup_timeout_seconds = 5.0
max_pages = 200
max_archive_entries = 2000
max_expanded_bytes = 67108864
max_compression_ratio = 1000.0
cpu_threads = 4
pdf_pipeline = "standard"
do_ocr = true
do_table_structure = true
languages = ["en", "zh", "ja", "ko", "tl", "id", "ms", "vi", "th", "mi", "ru"]
language_max_chars = 8000
language_min_chars = 30
language_min_confidence = 0.5
language_min_margin = 0.1

