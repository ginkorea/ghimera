# Explicit offline Chinese scan recipe, not a silent fallback or active service.
# Tested on unchanged controlled Simplified/Traditional scans; not full accuracy.
# Required-term checks pass, but the Simplified control still has a word error.
# Supply private paths and provision this exact manifest before running.
# Keep documents-standard.toml and documents-pacific.toml unchanged.
schema = "chimera.document-extraction/1"
worker_python = "/path/to/private/ghimera-documents/bin/python"
work_directory = "/path/to/private/ghimera/chinese-documents"
artifacts_directory = "/path/to/private/ghimera/pdf-models"
max_input_bytes = 16777216
max_output_bytes = 8388608
max_diagnostic_bytes = 65536
max_text_chars = 500000
max_links = 200
max_workers = 1
timeout_seconds = 240.0
cleanup_timeout_seconds = 5.0
max_pages = 200
max_archive_entries = 2000
max_expanded_bytes = 67108864
max_compression_ratio = 1000.0
cpu_threads = 2
pdf_pipeline = "standard"
do_ocr = true
do_table_structure = true
# Language-ID candidates are distinct from recognizer training/quality coverage.
languages = ["en", "zh", "ja", "ko", "tl", "id", "ms", "vi", "th", "mi", "ru"]
language_max_chars = 8000
language_min_chars = 30
language_min_confidence = 0.5
language_min_margin = 0.1

