# Add this table to a collector with an explicit [journal] storage root.
# Storage lives below that run's directory, not a second operator-selected root.
# Capacities count serialized original/result envelopes, including provenance.
[source_work]
schema = "ghimera.source-work/1"
max_operations = 1000
max_page_bytes = 33554432
max_result_bytes = 67108864
max_operation_bytes = 104857600
max_store_bytes = 1073741824
database_timeout_seconds = 2.0
